name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME is: $JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d'.' -f1)
          echo "Detected Java major version: $JAVA_VER"
          if [ -z "$JAVA_VER" ]; then
            echo "::error::Active Java version could not be detected."
            exit 1
          fi
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "::error::Active Java version ($JAVA_VER) is lower than 17."
            exit 1
          fi
          echo "Java environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkey -v -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          else
            echo "debug.keystore already exists."
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build the debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Expected APK not found at $APK_PATH"
            echo "Discovered APK files in app/build/outputs/apk:"
            find app/build/outputs/apk -name "*.apk" || true
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::APK file at $APK_PATH is empty"
            exit 1
          fi
          case "$APK_PATH" in
            *.apk) ;;
            *) echo "::error::$APK_PATH does not have .apk extension"; exit 1 ;;
          esac
          echo "APK successfully verified at $APK_PATH (Size: $(stat -c%s "$APK_PATH") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          TEMP_RELEASE_DIR=$(mktemp -d)
          cp "app/build/outputs/apk/debug/app-debug.apk" "${TEMP_RELEASE_DIR}/app-debug.apk"
          echo "asset_path=${TEMP_RELEASE_DIR}/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset at ${TEMP_RELEASE_DIR}/app-debug.apk"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET="${{ steps.prep_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET" ] || [ ! -s "$ASSET" ]; then
            echo "::error::Release asset verification failed for $ASSET"
            exit 1
          fi
          if [ "$(basename "$ASSET")" != "app-debug.apk" ]; then
            echo "::error::Asset name is not app-debug.apk"
            exit 1
          fi
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          RELEASE_NOTES=$(cat <<EOF
          This is an automatically generated debug APK.
          The APK was built by GitHub Actions.
          GitHub Actions run number: ${{ github.run_number }}
          GitHub Actions run attempt: ${{ github.run_attempt }}
          Source commit SHA: ${{ github.sha }}
          APK is intended for testing.
          APK is not a Play Store production release.
          APK is signed only with a temporary debug keystore.
          EOF
          )
          echo "Creating release $RELEASE_TAG..."
          gh release create "$RELEASE_TAG" "$ASSET" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "================================================"
            echo "Release published successfully!"
            gh release view "$RELEASE_TAG" || true
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release APK: app-debug.apk"
            echo "Direct URL: $DIRECT_URL"
            echo "================================================"
            echo "## DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "[Download app-debug.apk directly]($DIRECT_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Backup Actions artifact \`app-debug-apk\` remains available." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or was skipped."
            echo "The Actions artifact named app-debug-apk remains available as a backup."
            echo "## BUILD SUMMARY" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "APK build finished. Actions artifact \`app-debug-apk\` is available." >> "$GITHUB_STEP_SUMMARY"
          fi
